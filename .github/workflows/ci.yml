name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  native:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test workspace
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --all-targets --locked 2>&1 | tee cargo-test.log || {
            message=$(tail -n 120 cargo-test.log | awk '{ gsub(/%/, "%25"); sub(/\r$/, "%0D"); printf "%s%%0A", $0 }')
            echo "::error title=Workspace tests failed::$message"
            exit 1
          }
      - run: cargo build --workspace --release --locked
