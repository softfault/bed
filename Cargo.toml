[workspace]
resolver = "3"
members = [
    "crates/bed",
    "crates/bed-core",
    "crates/bed-file",
    "crates/bed-pty",
    "crates/bed-terminal",
    "crates/bed-terminal-session",
    "crates/bed-tui",
    "crates/bed-vt100",
]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
authors = ["softfault <givenyoung46@gmail.com>"]
license = "MIT"
repository = "https://github.com/softfault/bed"
homepage = "https://github.com/softfault/bed"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.104"
bed-core = { version = "0.4.1", path = "crates/bed-core" }
bed-file = { version = "0.4.1", path = "crates/bed-file" }
bed-pty = { version = "0.4.1", path = "crates/bed-pty" }
bed-terminal = { version = "0.4.1", path = "crates/bed-terminal" }
bed-terminal-session = { version = "0.4.1", path = "crates/bed-terminal-session" }
bed-tui = { version = "0.4.1", path = "crates/bed-tui" }
bed-vt100 = { version = "0.4.1", path = "crates/bed-vt100" }
regex = "1.13.1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
